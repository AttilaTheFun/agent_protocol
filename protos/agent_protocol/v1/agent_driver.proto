// Where an agent is watched and steered: the wrapper dials the driver
// (AGENT_DRIVER_URL, out through MultiPass) and keeps one stream open. Up
// go its conversation and what it is doing; down come messages, answers to
// its permission asks, a model to change to, an interrupt. Claude's `-p`,
// across harnesses, over gRPC, and outbound from the agent rather than
// inbound to it. Implemented by Visor's server, which keeps what it is told
// (a SQLite cache, the state in memory) for clients that come later, and
// sends pushes.
syntax = "proto3";

package agent_protocol.v1;

import "agent_protocol/v1/common.proto";

service AgentDriver {
  // Each call carries the agent's token, when its job had one (Job.token),
  // as metadata `authorization: Bearer <token>`: the driver tells its
  // agents apart by it.
  rpc Connect(stream WrapperMessage) returns (stream DriverMessage);
  // A resumed session's conversation, before its harness starts: its files
  // (the conversation, its subagents, the project's memory), each with
  // where it goes under the harness's own folder for the folder it will
  // work in. Empty for an agent the driver has no conversation of.
  rpc Conversation(ConversationRequest) returns (stream ConversationFile);
}

message ConversationRequest {
  AgentID agent = 1;
  // Where the resumed session will work, as the wrapper's machine has it:
  // the harness keys its conversations by this folder.
  string working_directory = 2;
  // The harness ("claude"), whose folder the places are under.
  string harness = 3;
}

// A file of the conversation, or a piece of one: `place` is its path
// under the harness's folder (Claude's ~/.claude, or $CLAUDE_CONFIG_DIR),
// already for the request's working directory. A file larger than a
// piece comes as several, in order, with the same place; `last` marks a
// file's last piece.
message ConversationFile {
  string place = 1;
  bytes data = 2;
  bool last = 3;
}

// The wrapper's first message on the stream, and again after a reconnect.
message WrapperHello {
  int32 protocol = 1;
  AgentID agent = 2;
  AgentSpec spec = 3;
  // The harness's session id, once known.
  string session_id = 4;
  // The machine it runs on, as people see it.
  string host_name = 5;
  // The id of the last entry the driver acknowledged before a reconnect;
  // empty to send the conversation from its start.
  string resume_after_entry = 6;
}

message WrapperMessage {
  oneof message {
    WrapperHello hello = 1;
    // New or changed rows, in order.
    Entries entries = 2;
    EphemeralState state = 3;
    ApprovalRequest approval = 4;
    // The agent ended: why.
    string ended = 5;
    // The harness's session id, when it changes (a fork, a resume).
    string session_id = 6;
    // A message from the agent's MCP client to the driver's MCP server
    // ("visor"), verbatim: a request, answered by DriverMessage.mcp with
    // the same id, or a notification (no id), answered by nothing.
    McpRequest mcp = 7;
    // An ApprovalRequest's id the agent no longer waits on (it gave up on
    // the call): its prompt can be withdrawn, and no Approval is needed.
    string approval_withdrawn = 8;
  }
}

// A JSON-RPC message from the agent's MCP client (Claude's), as it sent
// it to `agent-wrapper mcp`: the driver runs its MCP server's logic for the
// agent's session (the one whose token Connect showed) and answers.
message McpRequest {
  // The wrapper's id for this request, unique for the wrapper's life (not
  // the JSON-RPC id, which is in `json` and is the client's own): the
  // driver's McpResponse carries it back. Empty for a notification.
  string id = 1;
  // The JSON-RPC message, verbatim.
  string json = 2;
  // Which of the agent's MCP connections it came on (the wrapper numbers
  // them: "1", "2", … for each time the harness started the server), so
  // the driver can keep a connection's state (what it listed, what it
  // watches) apart.
  string client = 3;
}

// The driver's MCP server's answer, or a message of its own.
message McpResponse {
  // The McpRequest's id it answers; empty for a message the server sends
  // unasked (a notification: tools/list_changed, progress).
  string id = 1;
  // The JSON-RPC message, verbatim: the response to the request's JSON-RPC
  // id, with its result or error.
  string json = 2;
  // For an unasked message, the connection it is for (McpRequest.client);
  // empty for every connection.
  string client = 3;
}

message Entries {
  repeated TranscriptEntry entries = 1;
}

message DriverMessage {
  oneof message {
    // Words for the agent, as a turn (queued if it is busy).
    Send send = 1;
    Approval approval = 2;
    ModelChange model = 3;
    // Stop the turn under way.
    Empty interrupt = 4;
    // End the agent.
    Empty stop = 5;
    // The entries received, up to this id.
    string acknowledged = 6;
    // A fresh token for the agent, before the one it holds expires: shown
    // from then on, on the stream's next connection and every other call
    // (Job.token).
    string token = 7;
    // The driver's MCP server's answer to a WrapperMessage.mcp, or a
    // message of its own.
    McpResponse mcp = 8;
  }
}

message Send {
  // The message's id, so a resend is taken once.
  string id = 1;
  string text = 2;
  // Attachments, as paths where the agent runs.
  repeated string files = 3;
}

// The answer to an ApprovalRequest.
message Approval {
  string request_id = 1;
  bool allow = 2;
  // Why, when it is denied: the agent is told it.
  string reason = 3;
  // When it is allowed, the tool's input to run it with, as JSON (an
  // object: a question's answers added to AskUserQuestion's, say); empty
  // for the input as asked.
  string updated_input_json = 4;
}

message ModelChange {
  string model = 1;
  string effort = 2;
}

message Empty {}
