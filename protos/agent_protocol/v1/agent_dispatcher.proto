// The queue of agent jobs, which runners pull from, as GitHub's runners
// pull CI jobs. Implemented by Visor's server and by Shireworks' server
// (its jobs from GitHub issues). Drafted by Shireworks (12 Nov 2026).
//
// A runner claims a job (a long poll; none when the wait ends), keeps the
// claim by renewing it before `claim_expires`, and reports how it goes.
// Its wrapper reports too (Started, Completed, Failed). An unrenewed claim
// is released: the job goes back to the queue.
syntax = "proto3";

package agent_protocol.v1;

import "google/protobuf/timestamp.proto";
import "agent_protocol/v1/common.proto";

service AgentDispatcher {
  // The next job for this runner, waiting up to `wait_seconds` (60 at
  // most); none when the wait ends. A job given is claimed.
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  // How a claimed job goes: the dispatcher's own moves follow (Shireworks':
  // the issue's labels and comments).
  // A wrapper's report carries its agent's token (Job.token) as metadata
  // `authorization: Bearer <token>`; a runner's, the token it holds (see
  // Renew).
  rpc Report(JobReport) returns (ReportResponse);
  // The claim kept; one not renewed by `claim_expires` is released.
  // The runner shows the job's token as metadata `authorization: Bearer
  // <token>`: Job.token, until a renewal hands it a fresh one
  // (RenewResponse.token), which it shows from then on, on its later Renew
  // and Report.
  rpc Renew(RenewRequest) returns (RenewResponse);
}

message ClaimRequest {
  // The runner's name.
  string runner = 1;
  // What it can run: "native" or "container", and "harness:claude",
  // "harness:codex", "harness:echo"…
  repeated string capabilities = 2;
  int32 wait_seconds = 3;
}

message ClaimResponse {
  optional Job job = 1;
}

message Job {
  AgentID agent = 1;
  string title = 2;
  // What the agent is told first.
  string prompt = 3;
  // Where the job came from (an issue's URL).
  string source_url = 4;
  // What to clone and check out, for a runner that works in a clone.
  string repository = 5;
  string ref = 6;
  // "claude", "codex", "openrouter", "echo"; empty for the runner's default.
  string harness = 7;
  string model = 8;
  string effort = 9;
  repeated string labels = 10;
  google.protobuf.Timestamp claim_expires = 11;
  // Where a native agent works (no clone): its folder on the runner's computer.
  string working_directory = 12;
  // The driver the job's wrapper dials; empty to leave it to the runner's
  // settings. Visor's dispatcher names itself.
  string driver_url = 13;
  // A session moved here to carry on (a "Move to a runner…"): the harness's
  // own session to resume. Before it starts, the wrapper fetches that
  // conversation's files from its driver (AgentDriver.Conversation) and
  // clones `sources`. Empty for a new session.
  string resume_session_id = 14;
  // The repositories a resumed session worked in, each cloned where the
  // runner keeps sources (#345: clone only, never a copy of a checkout).
  repeated Source sources = 15;
  // The agent's own token, minted by the dispatcher for this job
  // (docs/retiring-multipass.md, section 4): the runner hands it to the
  // wrapper in AGENT_TOKEN, never on a command line, and the wrapper shows
  // it on each call it makes for the agent, as gRPC metadata
  // `authorization: Bearer <token>`. Empty from a dispatcher that mints
  // none.
  string token = 16;
}

// A repository a session works in: cloned under its name, at its ref.
message Source {
  // Its clone URL (https).
  string repository = 1;
  // The branch (or tag, or commit) to check out; empty for its default.
  string ref = 2;
  // The folder's name: the last part of where it was (`visor`).
  string name = 3;
}

message JobReport {
  AgentID agent = 1;
  oneof event {
    Started started = 2;
    Progress progress = 3;
    Blocked blocked = 4;
    Completed completed = 5;
    Failed failed = 6;
    Released released = 7;
  }
}

message Started {
  // The harness's session id.
  string session_id = 1;
  string runner = 2;
}

message Progress {
  string text = 1;
}

message Blocked {
  string reason = 1;
}

message Completed {
  string summary = 1;
  repeated string pull_requests = 2;
}

message Failed {
  string reason = 1;
}

// The runner gave the job back (its agent couldn't run, or it ended badly).
message Released {
  string reason = 1;
}

message ReportResponse {}

message RenewRequest {
  AgentID agent = 1;
}

message RenewResponse {
  // A later expiry, or none when the claim is no longer the runner's.
  google.protobuf.Timestamp claim_expires = 1;
  // A fresh token for the job (Job.token expires: Visor's last an hour),
  // which the runner shows from then on as its bearer on its later Renew
  // and Report. Empty: the runner keeps the one it holds, as it does with
  // a dispatcher that sends none. A runner that ignores it keeps showing
  // Job.token, so a dispatcher that sends it accepts that one on Renew and
  // Report past its `exp` while the job is held (Visor does). The wrapper's
  // own copy is refreshed by its driver (DriverMessage.token), not by this.
  string token = 2;
}
